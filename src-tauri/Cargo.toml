[package]
name = "hipercloudshell"
version = "0.2.0"
description = "HiperCloudShell ADE - Ultra-low memory Multi-Agent Orchestrator (Tauri v2 + Rust)"
authors = ["HiperCloudShell Team"]
edition = "2021"

[lib]
name = "hipercloudshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
regex = "1.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
